name: Secret Validation

# Adapted from the agent-guardrails-template for the Rust workspace.
#   - .env / credential files must never be committed (blocking)
#   - hardcoded secret *patterns* are flagged as warnings (high false-positive
#     rate in prose-heavy docs, so non-blocking)
#   - gitleaks runs as an informational scan (continue-on-error) because the
#     repo carries a large guardrails-template doc residue that trips entropy
#     heuristics; tune .gitleaks.toml before promoting it to blocking.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-env-files:
    name: No committed .env / credential files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for .env files
        run: |
          echo "Checking for accidentally committed .env files..."
          ENV_FILES=$(find . -name ".env*" ! -name ".env.example" ! -name ".env.template" -type f 2>/dev/null || true)
          if [ -n "$ENV_FILES" ]; then
            echo "ERROR: Found .env files that should not be committed:"
            echo "$ENV_FILES"
            echo "Please remove these files and add them to .gitignore"
            exit 1
          fi
          echo "No .env files found (good!)"
      - name: Check for credential files
        run: |
          PATTERNS=("*.pem" "*.key" "*credentials*.json" "*secrets*.json" "*service-account*.json")
          FOUND=""
          for pattern in "${PATTERNS[@]}"; do
            FILES=$(find . -name "$pattern" -type f 2>/dev/null || true)
            [ -n "$FILES" ] && FOUND="${FOUND}${FILES}"$'\n'
          done
          if [ -n "$FOUND" ]; then
            echo "WARNING: Found potential credential files (verify they are not real secrets):"
            echo "$FOUND"
          else
            echo "No credential files found (good!)"
          fi

  check-hardcoded-secrets:
    name: Hardcoded secret patterns (warning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for common secret patterns
        run: |
          PATTERNS=(
            "password\s*=\s*['\"]"
            "api_key\s*=\s*['\"]"
            "secret\s*=\s*['\"]"
            "token\s*=\s*['\"]"
            "aws_access_key_id\s*=\s*['\"]"
            "private_key\s*=\s*['\"]"
          )
          ISSUES=0
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -riE "$pattern" \
              --include="*.rs" --include="*.toml" --include="*.gd" \
              --include="*.py" --include="*.js" --include="*.ts" \
              --include="*.yaml" --include="*.yml" --include="*.json" . \
              2>/dev/null | grep -v node_modules | grep -v ".example" || true)
            if [ -n "$MATCHES" ]; then
              echo "WARNING: Potential hardcoded secret pattern found:"
              echo "$MATCHES"
              ISSUES=$((ISSUES + 1))
            fi
          done
          if [ $ISSUES -gt 0 ]; then
            echo "Found $ISSUES potential issue(s). If these are env-var references or examples, ignore."
          else
            echo "No obvious hardcoded secrets found (good!)"
          fi

  gitleaks-scan:
    name: Gitleaks scan (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
