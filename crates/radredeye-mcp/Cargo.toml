[package]
name = "radredeye-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stateless MCP (Model Context Protocol) capture server for radredeye: exposes the capture pipeline to AI agents and receives frames from any app framework."

[dependencies]
radredeye-core = { path = "../radredeye-core" }
image.workspace = true
tiny_http.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
