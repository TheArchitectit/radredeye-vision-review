[package]
name = "radredeye-webxr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebXR/WebGL adapter for radredeye — canvas capture via wasm-bindgen."

[lib]
crate-type = ["cdylib"]

[dependencies]
radredeye-core = { path = "../radredeye-core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebGlRenderingContext"] }
